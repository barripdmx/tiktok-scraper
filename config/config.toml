# config.toml — Configuración de referencia del proyecto TikTok scraper
#
# NOTA (REL-06): actualmente NINGÚN script carga este archivo; cada scraper
# deriva sus rutas por sí mismo (BASE_DIR, data/, secrets/, drivers/). Se
# conserva como referencia/plantilla; las rutas reflejan la estructura real.

[paths]
data_dir        = "data"
# SEC-01: la sesión vive en secrets/ (fuera de data/) para no filtrarla al
# compartir datasets. Los scrapers resuelven esta ruta vía resolve_cookies_path().
cookies_path    = "secrets/tiktok_cookies.json"
profile_dir     = "drivers/tiktok_profile"

[browser]
headless        = false
block_media     = true
# Cadena User-Agent. Actualizar cuando Chrome publique una versión mayor.
user_agent      = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36"

[scraping]
max_scroll      = 0          # 0 = sin límite
scroll_pause    = [1.2, 2.0] # [min, max] segundos entre scrolls
no_new_limit    = 3          # ciclos sin URLs nuevas antes de parar
no_new_limit_v2 = 6          # igual pero para el scraper v2 (búsqueda estricta)
strict_literal  = true       # v2: filtrar por coincidencia exacta

[filters]
date_margin_days = 3  # margen en días para el prefiltro por ID (is_likely_in_date_range)
